{% extends 'acervo/base.html' %}

{% block conteudo %}

<h1>Confirmar exclusão</h1>

<div class="caixa-confirmacao">
    <p>Tem certeza que deseja apagar "<strong>{{ objeto }}</strong>"?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Sim, apagar</button>
    </form>
    {% if voltar_url %}
        <a class="link-cancelar" href="{% url voltar_url %}">Cancelar</a>
    {% endif %}
</div>

{% endblock %}
