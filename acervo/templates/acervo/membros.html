{% extends 'acervo/base.html' %}

{% block conteudo %}

<div class="pagina-cabecalho">
    <h1>Membros</h1>
    <a class="botao-novo" href="{% url 'novo_membro' %}">+ Novo membro</a>
</div>

<form method="get" class="busca">
    <input type="text" name="nome" placeholder="Buscar por nome ou e-mail" value="{{ filtro_nome }}">

    <button type="submit">Buscar</button>
</form>

<ul>
    {% for membro in membros %}
        <li>
            <div class="card-corpo">
                <strong>{{ membro.nome }}</strong>
                <span class="meta">{{ membro.email }}</span>
            </div>
            <div class="card-acoes">
                <a href="{% url 'editar_membro' membro.pk %}">Editar</a>
                {% if user.perfil.eh_admin %}
                    <a href="{% url 'apagar_membro' membro.pk %}">Apagar</a>
                {% endif %}
            </div>
        </li>
    {% empty %}
        <li class="vazio">Nenhum membro cadastrado.</li>
    {% endfor %}
</ul>

{% endblock %}
